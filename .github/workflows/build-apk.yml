name: Build ZaibEx Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ZaibEx_Android_V3_6_NADEX_STYLE_ICON.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract ZaibEx project
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -q ZaibEx_Android_V3_6_NADEX_STYLE_ICON.zip -d extracted

      - name: Build ZaibEx APK
        working-directory: extracted/ZaibEx_Android_V3_6_NADEX_STYLE_ICON
        run: |
          gradle clean assembleDebug --stacktrace

      - name: Upload ZaibEx APK
        uses: actions/upload-artifact@v4
        with:
          name: ZaibEx-V3-6-APK
          path: extracted/ZaibEx_Android_V3_6_NADEX_STYLE_ICON/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
