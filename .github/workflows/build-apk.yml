name: Build ZaibEx APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract ZaibEx Project
        run: |
          rm -rf "$RUNNER_TEMP/zaibex"

          mkdir -p "$RUNNER_TEMP/zaibex"

          unzip -q \
            "ZaibEx_Android_V3_7_3_PRO_STABLE.zip" \
            -d "$RUNNER_TEMP/zaibex"

          echo "===== EXTRACTED FILES ====="
          find "$RUNNER_TEMP/zaibex" -maxdepth 3 -type f | sort

      - name: Find Android Project
        id: project
        shell: bash
        run: |
          PROJECT_DIR=$(find "$RUNNER_TEMP/zaibex" \
            -type f \
            -name "settings.gradle.kts" \
            -printf '%h\n' \
            | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR=$(find "$RUNNER_TEMP/zaibex" \
              -type f \
              -name "settings.gradle" \
              -printf '%h\n' \
              | head -n 1)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found."
            exit 1
          fi

          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Verify ZaibEx Project
        shell: bash
        run: |
          cd "${{ steps.project.outputs.project_dir }}"

          echo "===== PROJECT ROOT ====="
          pwd
          ls -la

          echo "===== APP MODULE ====="
          ls -la app

          echo "===== ZAIBEX PACKAGE CHECK ====="

          grep -R \
            'ae.zaibex.app' \
            app/build.gradle* \
            || true

          test -d app/src/main

      - name: Build ZaibEx Debug APK
        shell: bash
        run: |
          cd "${{ steps.project.outputs.project_dir }}"

          gradle clean assembleDebug --stacktrace

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          PROJECT="${{ steps.project.outputs.project_dir }}"

          APK=$(find "$PROJECT/app/build/outputs/apk/debug" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK generated:"
          echo "$APK"

          mkdir -p "$RUNNER_TEMP/output"

          cp "$APK" \
            "$RUNNER_TEMP/output/ZaibEx-V3.7.3-PRO-STABLE.apk"

          echo "apk_path=$RUNNER_TEMP/output/ZaibEx-V3.7.3-PRO-STABLE.apk" \
            >> "$GITHUB_OUTPUT"

      - name: Upload ZaibEx APK
        uses: actions/upload-artifact@v4
        with:
          name: ZaibEx-V3.7.3-PRO-STABLE-APK
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30
