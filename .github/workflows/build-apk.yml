name: Build ZaibEx Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ZaibEx_Android_V3_7_1_UI_UPDATE.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract ZaibEx project
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -q ZaibEx_Android_V3_7_1_UI_UPDATE.zip -d extracted

      - name: Find Android project
        id: project
        run: |
          PROJECT_DIR=$(find extracted -name settings.gradle.kts -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR=$(find extracted -name settings.gradle -printf '%h\n' | head -n 1)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found"
            find extracted -maxdepth 4 -type f | sort
            exit 1
          fi

          echo "Android project found at: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build ZaibEx APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew clean assembleDebug --stacktrace
          else
            gradle clean assembleDebug --stacktrace
          fi

      - name: Locate APK
        id: apk
        run: |
          APK=$(find "${{ steps.project.outputs.dir }}" \
            -path "*/build/outputs/apk/debug/*.apk" \
            -type f | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated"
            find "${{ steps.project.outputs.dir }}" -type f -name "*.apk" || true
            exit 1
          fi

          echo "APK found: $APK"
          cp "$APK" ZaibEx-V3.7.1.apk
          echo "apk=ZaibEx-V3.7.1.apk" >> "$GITHUB_OUTPUT"

      - name: Upload ZaibEx APK
        uses: actions/upload-artifact@v4
        with:
          name: ZaibEx-V3.7.1-APK
          path: ZaibEx-V3.7.1.apk
          if-no-files-found: error
