name: Build ZaibEx V3.5 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ZaibEx_Android_V3_5_VISIBILITY_ICON_FIX.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ZaibEx repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract ZaibEx V3.5
        run: |
          rm -rf extracted
          mkdir -p extracted

          unzip -q ZaibEx_Android_V3_5_VISIBILITY_ICON_FIX.zip -d extracted

          echo "=== ZAIBEX V3.5 EXTRACTED CONTENT ==="
          find extracted -maxdepth 3 -type f | sort | head -100

      - name: Verify ZaibEx V3.5 project
        run: |
          test -f extracted/ZaibEx_Android_V3_5_VISIBILITY_ICON_FIX/settings.gradle.kts
          test -f extracted/ZaibEx_Android_V3_5_VISIBILITY_ICON_FIX/build.gradle.kts
          test -f extracted/ZaibEx_Android_V3_5_VISIBILITY_ICON_FIX/app/build.gradle.kts

          echo "ZaibEx V3.5 project verified successfully"

      - name: Verify separate ZaibEx package
        run: |
          grep -q 'applicationId = "ae.zaibex.app"' \
          extracted/ZaibEx_Android_V3_5_VISIBILITY_ICON_FIX/app/build.gradle.kts

          echo "Confirmed package: ae.zaibex.app"
          echo "ZaibEx will remain separate from NadEx."

      - name: Build ZaibEx V3.5 APK
        working-directory: extracted/ZaibEx_Android_V3_5_VISIBILITY_ICON_FIX
        run: |
          gradle clean assembleDebug --stacktrace

      - name: Verify APK generated
        run: |
          APK="extracted/ZaibEx_Android_V3_5_VISIBILITY_ICON_FIX/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: ZaibEx V3.5 APK was not generated"
            exit 1
          fi

          echo "ZaibEx V3.5 APK successfully generated"
          ls -lh "$APK"

      - name: Upload ZaibEx V3.5 APK
        uses: actions/upload-artifact@v4
        with:
          name: ZaibEx-V3-5-Visibility-Icon-Fix-APK
          path: extracted/ZaibEx_Android_V3_5_VISIBILITY_ICON_FIX/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
