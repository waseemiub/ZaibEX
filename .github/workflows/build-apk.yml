name: Build ZaibEx APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract ZaibEx Package
        shell: bash
        run: |
          echo "Preparing ZaibEx V3.7.4..."

          rm -rf "$RUNNER_TEMP/zaibex"
          mkdir -p "$RUNNER_TEMP/zaibex"

          unzip -q \
            "ZaibEx_Android_V3_7_4_PRO_LOCKED.zip" \
            -d "$RUNNER_TEMP/zaibex"

          echo "===== EXTRACTED PACKAGE ====="
          find "$RUNNER_TEMP/zaibex" -maxdepth 4 -type f | sort

      - name: Find Android Project
        id: project
        shell: bash
        run: |
          PROJECT_DIR=$(find "$RUNNER_TEMP/zaibex" \
            -type f \
            -name "settings.gradle.kts" \
            -printf '%h\n' \
            | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR=$(find "$RUNNER_TEMP/zaibex" \
              -type f \
              -name "settings.gradle" \
              -printf '%h\n' \
              | head -n 1)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project could not be found."
            exit 1
          fi

          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Verify ZaibEx Source
        shell: bash
        run: |
          cd "${{ steps.project.outputs.project_dir }}"

          echo "===== PROJECT ROOT ====="
          pwd
          ls -la

          echo "===== APP SOURCE ====="
          test -d app/src/main

          if [ ! -f "app/build.gradle.kts" ] && \
             [ ! -f "app/build.gradle" ]; then
            echo "ERROR: app/build.gradle file missing."
            exit 1
          fi

          echo "ZaibEx Android source verified."

      - name: Build Debug APK
        shell: bash
        run: |
          cd "${{ steps.project.outputs.project_dir }}"

          echo "Building ZaibEx V3.7.4 PRO LOCKED..."

          gradle clean assembleDebug --stacktrace

      - name: Find Generated APK
        id: apk
        shell: bash
        run: |
          PROJECT="${{ steps.project.outputs.project_dir }}"

          APK=$(find "$PROJECT/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "Generated APK:"
          echo "$APK"

          mkdir -p "$RUNNER_TEMP/final-apk"

          cp "$APK" \
            "$RUNNER_TEMP/final-apk/ZaibEx-V3.7.4-PRO-LOCKED.apk"

          echo "apk_path=$RUNNER_TEMP/final-apk/ZaibEx-V3.7.4-PRO-LOCKED.apk" \
            >> "$GITHUB_OUTPUT"

      - name: Upload ZaibEx APK
        uses: actions/upload-artifact@v4
        with:
          name: ZaibEx-V3.7.4-PRO-LOCKED-APK
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30
